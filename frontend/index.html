<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shorten</title>
<style>
  :root {
    --bg: #f7f6f3;
    --surface: #ffffff;
    --border: #e4e2dc;
    --text: #1c1b19;
    --text-muted: #6b6862;
    --accent: #2f6f5e;
    --accent-text: #ffffff;
    --shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  html.dark {
    --bg: #17181a;
    --surface: #202124;
    --border: #303236;
    --text: #eceae5;
    --text-muted: #98958e;
    --accent: #5fb79b;
    --accent-text: #0f1210;
    --shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background 0.25s ease, color 0.25s ease;
    min-height: 100vh;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 64px 24px 80px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 48px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }

  /* toggle switch */
  .toggle {
    position: relative;
    width: 44px;
    height: 24px;
    border-radius: 999px;
    background: var(--border);
    border: none;
    cursor: pointer;
    padding: 0;
    flex-shrink: 0;
  }
  .toggle .knob {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--surface);
    box-shadow: var(--shadow);
    transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
  html.dark .toggle .knob { transform: translateX(20px); }

  form {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    font-size: 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    outline: none;
    transition: border-color 0.2s ease, background 0.25s ease;
  }
  input[type="text"]:focus {
    border-color: var(--accent);
  }
  button.submit {
    padding: 12px 18px;
    font-size: 14px;
    font-weight: 500;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  button.submit:hover { opacity: 0.9; }
  button.submit:active { transform: scale(0.97); }
  button.submit:disabled { opacity: 0.5; cursor: default; }

  .status {
    font-size: 13px;
    min-height: 18px;
    margin-bottom: 8px;
  }
  .status.error { color: #c0503f; }
  .status.ok { color: var(--text-muted); }
  .status a { color: var(--accent); }

  h2 {
    font-size: 13px;
    font-weight: 600;
    text-transform: none;
    color: var(--text-muted);
    margin: 40px 0 12px;
  }

  .empty {
    font-size: 13px;
    color: var(--text-muted);
    padding: 20px 0;
    border-top: 1px solid var(--border);
  }

  .link-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 0;
    border-top: 1px solid var(--border);
    animation: rise 0.3s ease both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .link-row .info { min-width: 0; }
  .link-row .short {
    font-size: 14px;
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
  }
  .link-row .short:hover { text-decoration: underline; }
  .link-row .orig {
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 320px;
  }
  .link-row .clicks {
    font-size: 12px;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Shorten</h1>
    <button class="toggle" id="themeToggle" aria-label="Toggle dark mode">
      <span class="knob"></span>
    </button>
  </header>

  <form id="shortenForm">
    <input id="longUrl" type="text" placeholder="Paste a URL" autocomplete="off">
    <button class="submit" type="submit" id="submitBtn">Shorten</button>
  </form>
  <div class="status" id="status"></div>

  <h2>Your links</h2>
  <div id="linksList"></div>
</div>

<script>
const API_URL = "API_GATEWAY_INVOKE_URL";
const links = JSON.parse(localStorage.getItem("myLinks") || "[]");

// theme
const themeToggle = document.getElementById("themeToggle");
function applyTheme(mode) {
  document.documentElement.classList.toggle("dark", mode === "dark");
  localStorage.setItem("theme", mode);
}
const savedTheme = localStorage.getItem("theme")
  || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
applyTheme(savedTheme);
themeToggle.addEventListener("click", () => {
  const next = document.documentElement.classList.contains("dark") ? "light" : "dark";
  applyTheme(next);
});

// links list
function renderLinks() {
  const list = document.getElementById("linksList");
  if (links.length === 0) {
    list.innerHTML = `<div class="empty">No links yet — shorten one above.</div>`;
    return;
  }
  list.innerHTML = links.map(link => {
    const shortUrl = `${API_URL}/${link.shortcode}`;
    return `
      <div class="link-row">
        <div class="info">
          <a class="short" href="${shortUrl}" target="_blank">${shortUrl.replace(/^https?:\/\//, "")}</a><br>
          <span class="orig">${link.longUrl}</span>
        </div>
        <div class="clicks">${link.clickCount ?? 0} clicks</div>
      </div>
    `;
  }).join("");
}

// form submit
const form = document.getElementById("shortenForm");
const statusEl = document.getElementById("status");
const submitBtn = document.getElementById("submitBtn");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = document.getElementById("longUrl");
  const longUrl = input.value.trim();
  if (!longUrl) return;

  submitBtn.disabled = true;
  statusEl.textContent = "Shortening...";
  statusEl.className = "status";

  try {
    const res = await fetch(`${API_URL}/shorten`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ longUrl })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Failed to shorten");

    const shortUrl = `${API_URL}/${data.shortcode}`;
    statusEl.innerHTML = `Created: <a href="${shortUrl}" target="_blank">${shortUrl}</a>`;
    statusEl.className = "status ok";

    links.unshift({ shortcode: data.shortcode, longUrl: data.longUrl, clickCount: 0 });
    localStorage.setItem("myLinks", JSON.stringify(links));
    renderLinks();
    input.value = "";
  } catch (err) {
    statusEl.textContent = "Error: " + err.message;
    statusEl.className = "status error";
  } finally {
    submitBtn.disabled = false;
  }
});

renderLinks();
</script>
</body>
</html>
